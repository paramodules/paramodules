name: PR Check

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup
            - uses: ./.github/actions/test

    build-pkg:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/build-pkg
              with:
                  filter: paramodules
                  dist_path: packages/react/dist

    build-docs:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/build-docs
              with:
                  upload_pages_artifact: "false"
